name: mirage-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Mirage's unit tests need no models, camera or display, so a light
      # install is enough; the full requirements.txt is not needed here.
      - name: Install test dependencies
        run: python -m pip install numpy opencv-python-headless pillow pytest "ruff==0.15.7"
      - name: Ruff
        run: ruff check --output-format=github mirage tests scripts third_party
      - name: Pytest
        run: python -m pytest -q tests/mirage third_party/deep-live-cam/tests
